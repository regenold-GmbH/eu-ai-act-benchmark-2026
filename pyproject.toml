[project]
name = "regenold-evals"
version = "0.1.0"
description = "Reproducible EU AI Act question-answering benchmark"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "regenold gmbh" }]
dependencies = [
    "litellm==1.83.0",
    "openpyxl==3.1.5",
    "pandas==3.0.2",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
rag = [
    "llama-index-core==0.14.25",
    "llama-index-embeddings-openai==0.6.0",
    "llama-index-llms-openai==0.7.10",
    "pypdf==6.19.0",
]

[dependency-groups]
dev = ["pytest==9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
